<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="645" height="704" viewBox="0 0 645 704"
     role="img" aria-label="Subtle off-white lined paper background">
  <defs>
    <!-- Seamless horizontal ruling, repeated every 51 pixels. -->
    <pattern id="paper-lines" patternUnits="userSpaceOnUse"
             width="645" height="51">
      <path d="M0 20.5 H645"
            fill="none" stroke="#c9c8c4"
            stroke-width="1" opacity="0.82"/>
    </pattern>

    <!-- Very subtle paper grain for a natural, non-flat surface. -->
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78"
                    numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="645" height="704" fill="#f8f7f4"/>
  <rect width="645" height="704" fill="url(#paper-lines)"/>
  <rect width="645" height="704" filter="url(#paper-grain)" opacity="0.32"/>
</svg>
